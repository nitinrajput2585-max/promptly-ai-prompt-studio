services:
  - type: web
    name: promptly-ai-prompt-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_USERNAME
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: HOST
        value: 0.0.0.0
